{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} ForumMember | NexusCommunity{% endblock %}
{% block page_title %}{% if editing %}Edit ForumMember{% else %}New ForumMember{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ record.username|default:'' }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ record.email|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Join Date</label>
        <input type="date" name="join_date" value="{{ record.join_date|date:'Y-m-d'|default:'' }}">
      </div>
      <div class="form-group">
        <label>Posts</label>
        <input type="number" name="posts" value="{{ record.posts|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Reputation</label>
        <input type="number" name="reputation" value="{{ record.reputation|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select name="role">
          <option value="member" {% if record.role == 'member' %}selected{% endif %}>Member</option>
          <option value="moderator" {% if record.role == 'moderator' %}selected{% endif %}>Moderator</option>
          <option value="admin" {% if record.role == 'admin' %}selected{% endif %}>Admin</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea name="bio">{{ record.bio|default:'' }}</textarea>
    </div>
    <div class="form-group">
      <div class="checkbox-wrapper">
        <input type="checkbox" name="active" id="id_active" {% if record.active %}checked{% endif %}>
        <label for="id_active" style="margin-bottom:0">Active</label>
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} ForumMember</button>
      <a href="/forummembers/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
