{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} Topic | NexusCommunity{% endblock %}
{% block page_title %}{% if editing %}Edit Topic{% else %}New Topic{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{ record.title|default:'' }}">
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" value="{{ record.category|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Author</label>
        <input type="text" name="author" value="{{ record.author|default:'' }}">
      </div>
      <div class="form-group">
        <label>Replies</label>
        <input type="number" name="replies" value="{{ record.replies|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Views</label>
        <input type="number" name="views" value="{{ record.views|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="open" {% if record.status == 'open' %}selected{% endif %}>Open</option>
          <option value="closed" {% if record.status == 'closed' %}selected{% endif %}>Closed</option>
          <option value="pinned" {% if record.status == 'pinned' %}selected{% endif %}>Pinned</option>
          <option value="locked" {% if record.status == 'locked' %}selected{% endif %}>Locked</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Last Reply</label>
        <input type="date" name="last_reply" value="{{ record.last_reply|date:'Y-m-d'|default:'' }}">
      </div>
      <div class="form-group">
        <label>Tags</label>
        <input type="text" name="tags" value="{{ record.tags|default:'' }}">
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} Topic</button>
      <a href="/topics/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
